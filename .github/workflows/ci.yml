name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DISABLE_SQLALCHEMY_CEXT: "1"
      SQLALCHEMY_DISABLE_CEXT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install SQLAlchemy --no-binary sqlalchemy
          pip install -r requirements.txt

      # ── Unit tests with coverage gate ──────────────────────────
      - name: Run unit tests with branch coverage
        run: |
          DISABLE_SQLALCHEMY_CEXT=1 python -m pytest ../tests/team/area1/test_services.py \
            -v --tb=short \
            --cov=app --cov-branch \
            --cov-report=term-missing \
            --junitxml=../tests/team/area1/test_results.xml

      - name: Enforce 100% coverage on services.py
        run: |
          DISABLE_SQLALCHEMY_CEXT=1 python -m pytest ../tests/team/area1/test_services.py \
            -q --no-header \
            --cov=app.services --cov-branch \
            --cov-fail-under=100

      # ── Mutation gate ──────────────────────────────────────────
      - name: Run mutation testing (mutmut)
        run: |
          DISABLE_SQLALCHEMY_CEXT=1 python -m mutmut run \
            --paths-to-mutate=app/services.py \
            --tests-dir=../tests/team/area1/ \
            --runner="DISABLE_SQLALCHEMY_CEXT=1 python -m pytest ../tests/team/area1/test_services.py -x -q --no-header --tb=no"
          echo "mutmut exit code: $?"

      - name: Enforce mutation score = 100%
        run: |
          SURVIVED=$(python -m mutmut results 2>&1 | grep -c "Survived")
          echo "Survived mutant lines: $SURVIVED"
          if [ "$SURVIVED" -gt 1 ]; then
            echo "::error::Mutation testing failed - surviving mutants detected"
            python -m mutmut results
            exit 1
          fi
          echo "All mutants killed - mutation gate passed"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
